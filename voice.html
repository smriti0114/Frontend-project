<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Generator - Textorr.com</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/voice.css">
</head>
<body>
    <div class="bg-animation"></div>
    <header id="header"></header>

    <div class="container">
        <div class="header">
            <h1>
                <svg class="mic-icon" width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                </svg>
                Voice Generator
            </h1>
            <p>Transform text into natural speech</p>
            <span class="usage-counter-badge" style="display: none;"></span>
        </div>

        <div class="voice-settings">
            <div class="setting-group">
                <label>Language</label>
                <select id="language">
                    <option value="en-US">English (US)</option>
                    <option value="en-GB">English (UK)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="pt-BR">Portuguese</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="ko-KR">Korean</option>
                    <option value="zh-CN">Chinese</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Speed</label>
                <select id="speed">
                    <option value="0.75">Slow</option>
                    <option value="1" selected>Normal</option>
                    <option value="1.25">Fast</option>
                    <option value="1.5">Very Fast</option>
                </select>
            </div>
            <div class="setting-group" style="grid-column: span 2; margin-top: 0.5rem;">
                <label>Voice Mode</label>
                <select id="voiceMode">
                    <option value="premium" selected>Premium Voice (High Quality & Downloadable)</option>
                    <option value="instant">Instant Voice (Fast - Browser Synthesis)</option>
                </select>
            </div>
        </div>

        <div class="textarea-wrapper">
            <textarea 
                id="text-input" 
                placeholder="Type or paste your text here... (max 5000 characters)"
                maxlength="5000"
                aria-label="Text input to convert to speech"
            ></textarea>
            <div class="char-count">
                <span id="char-count">0</span> / 5000
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
            <span class="btn-text">Generate Voice</span>
            <div class="loader"></div>
        </button>

        <div class="audio-section" id="audioSection">
            <div class="visualizer-container">
                <div class="visualizer" id="visualizer"></div>
                
                <div class="custom-player">
                    <div class="player-time">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <div class="audio-controls">
                <button class="control-btn" id="playBtn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Play
                </button>
                <button class="control-btn" id="pauseBtn" style="display:none;">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                    </svg>
                    Pause
                </button>
                <button class="control-btn" id="downloadBtn">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Download
                </button>
            </div>
        </div>

        <a href="index.html" class="back-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Back to Home
        </a>
    </div>

    <audio id="audio-player" style="display: none;"></audio>
    <div class="tooltip" id="tooltip"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/usage-limit.js"></script>
    <script src="js/voice-engine.js"></script>
</body>
</html>
