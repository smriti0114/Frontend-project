<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Converter - Textorr.com</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/language.css">
</head>
<body>
    <div class="bg-animation"></div>
    <header id="header"></header>

    <div class="container">
        <div class="header">
            <h1>
                <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
                </svg>
                Language Converter
            </h1>
            <p>Translate text between languages instantly</p>
            <span class="usage-counter-badge" style="display: none;"></span>
        </div>

        <div class="translation-wrapper">
            <!-- Source Text Box -->
            <div class="text-box" id="sourceBox">
                <div class="text-box-header">
                    <div class="language-selector">
                        <span class="flag-icon" id="sourceFlag">🇬🇧</span>
                        <select id="sourceLang">
                            <option value="en" data-flag="🇬🇧">English</option>
                            <option value="es" data-flag="🇪🇸">Spanish</option>
                            <option value="fr" data-flag="🇫🇷">French</option>
                            <option value="de" data-flag="🇩🇪">German</option>
                            <option value="it" data-flag="🇮🇹">Italian</option>
                            <option value="pt" data-flag="🇵🇹">Portuguese</option>
                            <option value="ru" data-flag="🇷🇺">Russian</option>
                            <option value="ja" data-flag="🇯🇵">Japanese</option>
                            <option value="ko" data-flag="🇰🇷">Korean</option>
                            <option value="zh" data-flag="🇨🇳">Chinese</option>
                            <option value="ar" data-flag="🇸🇦">Arabic</option>
                            <option value="hi" data-flag="🇮🇳">Hindi</option>
                        </select>
                    </div>
                    <span class="char-count"><span id="charCount">0</span> / 5000</span>
                </div>
                <textarea 
                    id="sourceText" 
                    placeholder="Type or paste your text here..."
                    maxlength="5000"
                    aria-label="Source text to translate"
                ></textarea>
                <div class="text-box-footer">
                    <div class="detected-lang" id="detectedLang" style="display: none;">
                        Detected: <strong id="detectedLangName"></strong>
                    </div>
                    <button class="action-btn" id="clearBtn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                        Clear
                    </button>
                </div>
            </div>

            <!-- Swap Button -->
            <div class="swap-container">
                <button class="swap-btn" id="swapBtn" aria-label="Swap source and target languages">
                    <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                        <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
                    </svg>
                </button>
            </div>

            <!-- Target Text Box -->
            <div class="text-box" id="targetBox">
                <div class="text-box-header">
                    <div class="language-selector">
                        <span class="flag-icon" id="targetFlag">🇪🇸</span>
                        <select id="targetLang">
                            <option value="es" data-flag="🇪🇸" selected>Spanish</option>
                            <option value="en" data-flag="🇬🇧">English</option>
                            <option value="fr" data-flag="🇫🇷">French</option>
                            <option value="de" data-flag="🇩🇪">German</option>
                            <option value="it" data-flag="🇮🇹">Italian</option>
                            <option value="pt" data-flag="🇵🇹">Portuguese</option>
                            <option value="ru" data-flag="🇷🇺">Russian</option>
                            <option value="ja" data-flag="🇯🇵">Japanese</option>
                            <option value="ko" data-flag="🇰🇷">Korean</option>
                            <option value="zh" data-flag="🇨🇳">Chinese</option>
                            <option value="ar" data-flag="🇸🇦">Arabic</option>
                            <option value="hi" data-flag="🇮🇳">Hindi</option>
                        </select>
                    </div>
                </div>
                <textarea 
                    id="targetText" 
                    placeholder="Translation will appear here..."
                    readonly
                    aria-label="Translation result"
                ></textarea>
                <div class="text-box-footer">
                    <div></div>
                    <button class="action-btn" id="copyBtn" disabled>
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        Copy
                    </button>
                </div>
            </div>
        </div>

        <button class="translate-btn" id="translateBtn">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
            </svg>
            <span class="btn-text">Translate</span>
            <div class="loader"></div>
        </button>

        <a href="index.html" class="back-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Back to Home
        </a>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/usage-limit.js"></script>
    <script src="js/translator.js"></script>
</body>
</html>
